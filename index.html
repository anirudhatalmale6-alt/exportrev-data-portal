<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExportRev — Automotive Data Portal</title>
<meta name="description" content="Subscription portal for automotive parts, technical and salvage vehicle data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="logo">
      <div class="mark">ER</div>
      <div><b>ExportRev</b><span>Data Portal</span></div>
    </div>
    <div id="nav"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="search">
        <span class="dim">⌕</span>
        <input id="gsearch" placeholder="Search article number, OE reference, part name…">
      </div>
      <span class="env">Preview build</span>
      <div class="avatar">NT</div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
